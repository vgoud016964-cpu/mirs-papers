<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRS Practice Papers | Student Portal</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#15223b;--muted:#68758d;--primary:#4b43c7;--teal:#0e9f9a;--line:#dce3f0;--surface:#fff;--bg:#f4f6fc;--shadow:0 10px 30px rgba(38,39,94,.08)}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at top left,#e9eaff 0,transparent 43%),var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(115deg,#25245d 0%,#4b43c7 64%,#167e99 100%);color:#fff;padding:18px max(18px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(43,42,121,.18)}
header h1{margin:0;font-size:clamp(18px,2.5vw,22px); display:flex; align-items:center; gap:10px;}
main{max-width:900px;margin:26px auto;padding:0 18px 42px}
.card{background:#fff;border:1px solid rgba(216,222,241,.95);border-radius:16px;padding:clamp(18px,3vw,26px);margin-bottom:16px;box-shadow:var(--shadow)}
h2{margin:0 0 14px;font-size:21px}
label{display:block;font-size:13px;font-weight:750;color:#384562;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid #cbd3e6;border-radius:10px;background:#fff;color:var(--ink);font:inherit}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
button.go{background:linear-gradient(115deg,#4b43c7,#7068e9);color:#fff;border:0;padding:12px 21px;border-radius:10px;font-weight:750;cursor:pointer;margin-top:14px;box-shadow:0 5px 13px rgba(75,67,199,.19)}
button.go:disabled{opacity:.55;cursor:wait}
button.sec{background:#fff;color:#4b43c7;border:1px solid #cbc9f5;padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:700}
button.on{background:linear-gradient(120deg,#4b43c7,#6961e5);color:#fff;border-color:transparent}
.small{font-size:13px;color:var(--muted)}
.status{margin-top:10px;font-weight:650}
.status.err{color:#b42335}
.item{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e8ebf4}
.item:last-child{border:0}
.q{border:1px solid #dfe2f2;border-radius:13px;padding:15px;margin:12px 0;background:linear-gradient(145deg,#fff,#fafaff)}
.opt{margin:4px 0 0 18px}
.ans{background:#eefbf2;border-left:4px solid #16a34a;padding:10px 12px;border-radius:8px;margin-top:10px;white-space:pre-wrap}
.rep{margin-top:10px}
.rep button{background:#fff7f7;color:#b42335;border:1px solid #f2b8bf;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:650}
.doubt-card{background:#f7f7ff;border:1px solid #d9d9f7;border-radius:14px;padding:14px;margin:14px 0}
.doubt-answer{white-space:pre-wrap;margin-top:10px;min-height:22px}
[hidden]{display:none!important}
@media print{.noprint,header,.rep{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
  <h1>
    <img src="book.jpg" style="height:55px; width:auto; border-radius:5px;" alt="Logo">
    MIRS Practice Papers
  </h1>
  <span class="small" style="color:#fff">Student portal</span>
</header>
<main>
<section id="s1" class="card">
  <h2>🔐 Open a paper</h2>
  <div class="row">
    <div><label>Class</label><select id="cls"><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
    <div><label>Class code</label><input id="code" placeholder="Type class code"></div>
    <div><label>Section</label><select id="sec"></select></div>
    <div><label>Section code</label><input id="scode" placeholder="Type section code"></div>
  </div>
  <button id="openBtn" class="go">Open →</button>
  <p id="s1msg" class="status err"></p>
</section>

<section id="s2" class="card" hidden>
  <h2 id="s2title"></h2>
  <div id="subs" class="row"></div>
  <div id="list"></div>
  <button id="back1" class="sec">← Back</button>
</section>

<section id="s3" class="card" hidden>
  <h2 id="ptitle"></h2>
  <p id="pinfo" class="small"></p>
  <div id="paper"></div>
  <button id="printBtn" class="go">🖨️ Print</button>
  <button id="back2" class="sec">← Back</button>
</section>

<div class="card">
  <h3 style="margin-top:0">🧠 Ask Anything Educational</h3>
  <p class="small">Ask any general knowledge, school, or current affairs question. Sports scores and bad words are blocked.</p>
  <textarea id="studentAskInput" placeholder="Type your question here..."></textarea>
  <button id="studentAskBtn" class="go">🤖 Ask AI</button>
  <div id="studentAskAnswer" style="white-space:pre-wrap;margin-top:12px;padding:12px;background:#fff;border-radius:10px;border:1px solid #dce5f2;min-height:100px;overflow-y:auto;"></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyCOQ-jq_ObgDWiD8C8v_HX2IxJ1FYOSe9Y", authDomain:"mirs-ai.firebaseapp.com", projectId:"mirs-ai", storageBucket:"mirs-ai.firebasestorage.app", messagingSenderId:"478184601355", appId:"1:478184601355:web:85f99d485db2e12860940e" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const WORKER_URL = "https://mirs-papers-ai.vgoud016964.workers.dev";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
const SUBJECTS = ["Physics","Chemistry","Biology","Mathematics","Social"];
const SECTIONS = ["K1","K2","K3","K4","A1","A2","A3","A4","S1","S2","S3","S4","N1","N2","N3","N4"];
const ICON = { Physics:"⚛️", Chemistry:"🧪", Biology:"🧬", Mathematics:"📐", Social:"🌍" };
const AR_OPTS = { A:"Both A and R are true, and R is the correct explanation of A.", B:"Both A and R are true, but R is not the correct explanation of A.", C:"A is true, but R is false.", D:"A is false, but R is true." };
let classNo=0, section="All", subject="", papers=[], open=null;

$("sec").innerHTML = `<option value="All">All sections</option>` + SECTIONS.map(x=>`<option value="${x}">${x}</option>`).join("");

async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function show(id){ ["s1","s2","s3"].forEach(x=>$(x).hidden = x!==id); window.scrollTo(0,0); }

$("studentAskBtn").onclick = async () => {
  const q = $("studentAskInput").value.trim();
  if (q.length<2) return;
  const b=$("studentAskBtn"), a=$("studentAskAnswer");
  b.disabled=true; b.textContent="⏳ Thinking..."; a.textContent="Checking...";
  
  try {
    const r = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action:"ask", question:q }) });
    const j = await r.json();
    a.textContent = j.ok ? j.answer : (j.error || "Could not answer.");
  } catch { 
    a.textContent = "Could not reach AI service."; 
  }
  finally { 
    b.disabled=false; b.textContent="Ask AI"; 
  }
};

$("openBtn").onclick = async () => {
  const c=+$("cls").value, v=$("code").value.trim().toLowerCase();
  const sec=$("sec").value, sv=$("scode").value.trim().toLowerCase();
  $("s1msg").textContent = "";
  if (!v) return $("s1msg").textContent = "Type the class code.";
  if (sec!=="All" && !sv) return $("s1msg").textContent = "Type the section code.";
  $("openBtn").disabled = true;
  try {
    const s = await getDoc(doc(db,"settings","classCodeHashes"));
    const want = s.exists() ? s.data()[c] : null;
    if (!want || want !== await sha(c+":"+v)) return $("s1msg").textContent = "Wrong class code.";
    if (sec!=="All"){
      const s2 = await getDoc(doc(db,"settings","sectionCodeHashes"));
      const wantS = s2.exists() ? s2.data()[sec] : null;
      if (!wantS || wantS !== await sha("section:"+sec+":"+sv)) return $("s1msg").textContent = "Wrong section code.";
    }
    classNo=c; section=sec; subject="";
    $("s2title").textContent = `🎓 Class ${c}${sec!=="All"?" · Section "+sec:""}`;
    $("subs").innerHTML = SUBJECTS.map(x=>`<button data-s="${x}">${ICON[x]} ${x}</button>`).join("");
    $("list").innerHTML = ""; show("s2");
  } catch { $("s1msg").textContent = "Connection error."; }
  finally { $("openBtn").disabled=false; }
};

$("subs").addEventListener("click", async e => {
  const b=e.target.closest("[data-s]"); if (!b) return;
  subject=b.dataset.s;
  $("subs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  $("list").textContent="Loading...";
  try {
    const snap = await getDocs(query(collection(db,"papers"), where("classNo","==",classNo), where("subject","==",subject)));
    let list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if (section!=="All") list = list.filter(p=>!p.section || p.section==="All" || p.section===section);
    papers = list.sort((a,b)=>String(a.topic).localeCompare(String(b.topic)));
    $("list").innerHTML = papers.length
      ? papers.map((p,i)=>`<div class="item"><div><b>${esc(p.topic)}</b><br><span class="small">${p.mode==="practice"?"📝 Practice":"📄 Question"} · ${(p.questions||[]).length} Qs</span></div><button class="sec" data-p="${i}">Open →</button></div>`).join("")
      : "<p class='small'>📭 No papers yet.</p>";
  } catch { $("list").textContent="Could not load papers."; }
});

$("list").addEventListener("click", e => {
  const b=e.target.closest("[data-p]"); if (!b) return;
  open = papers[+b.dataset.p]; renderPaper(); show("s3");
});
$("back1").onclick = () => show("s1");
$("back2").onclick = () => show("s2");
$("printBtn").onclick = () => window.print();

function renderPaper(){
  const p=open, practice=p.mode==="practice", qs=p.questions||[];
  $("ptitle").textContent = `📘 Class ${p.classNo} · ${p.subject} · ${p.topic}`;
  $("pinfo").textContent = practice ? "📝 Practice paper: answer after each question." : "📄 Question paper: answers at the end.";
  let h = qs.map((q,i)=>{
    let x = `<div class="q"><p><b>Q${i+1}.</b> `;
    if (q.type==="ar"){
      x += `<b>Assertion:</b> ${nl(q.assertion)}</p><p><b>Reason:</b> ${nl(q.reason)}</p>`;
      x += ["A","B","C","D"].map(l=>`<div class="opt">(${l}) ${esc(AR_OPTS[l])}</div>`).join("");
    } else {
      x += `${nl(q.q)}</p>`;
      if (q.type==="mcq") x += (q.options||[]).map((o,k)=>`<div class="opt">(${"ABCD"[k]}) ${esc(o)}</div>`).join("");
    }
    if (practice) x += `<div class="ans">✅ <b>Answer (${esc(q.answer)})</b><br>${nl(q.explanation||q.answer)}</div>`;
    x += `<div class="rep"><button data-r="${i}">🚩 Report</button></div></div>`;
    return x;
  }).join("");
  if (!practice){
    h += `<h3>🔑 Answer Key</h3>` + qs.map((q,i)=>`<div class="ans" style="margin-bottom:8px"><b>Q${i+1}:</b> ${esc(q.answer)}</div>`).join("");
  }
  h += `<div class="doubt-card noprint"><h3>💬 Ask a doubt about this topic</h3><p class="small">Ask about <b>${esc(p.topic)}</b>.</p><textarea id="studentDoubtQuestion" maxlength="500" placeholder="Type your doubt..."></textarea><button id="studentDoubtBtn" class="go">🤖 Ask AI</button><div id="studentDoubtAnswer" class="doubt-answer" aria-live="polite"></div></div>`;
  $("paper").innerHTML = h;
}

$("paper").addEventListener("click", async e => {
  const ask = e.target.closest("#studentDoubtBtn");
  if (ask && open){
    const question = $("studentDoubtQuestion").value.trim();
    const ans = $("studentDoubtAnswer");
    if (question.length<2){ ans.textContent = "Type your doubt first."; return; }
    ask.disabled=true; ask.textContent="⏳ Thinking..."; ans.textContent="Checking...";
    try {
      const r = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ action:"doubt", classNo:Number(open.classNo), subject:String(open.subject||""), topic:String(open.topic||""), question }) });
      const j = await r.json();
      ans.textContent = j.ok ? j.answer : (j.error || "Could not answer.");
    } catch { ans.textContent = "Could not reach AI."; }
    finally { ask.disabled=false; ask.textContent="🤖 Ask AI"; }
    return;
  }
  const b = e.target.closest("[data-r]"); if (!b||!open) return;
  const note = prompt("What is wrong with this question?"); if (!note) return;
  try {
    await addDoc(collection(db,"reports"), { paperId:open.id, title:open.title||open.topic, qNo:+b.dataset.r+1, note:note.trim().slice(0,300), createdAt:new Date().toISOString() });
    b.textContent="✅ Reported"; b.disabled=true;
  } catch { alert("Could not send report."); }
});
</script>
</body>
</html>
